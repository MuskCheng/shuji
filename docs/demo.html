<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e12">
<title>书迹 · 我的阅读年轮</title>
<style>
:root{
  --bg:#0a0e12; --card:rgba(19,26,34,.78); --border:rgba(255,255,255,.09);
  --fg:#eef2f6; --muted:#8b98a5; --dim:#5c6875;
  --gold:#e8b04b; --gold2:#f5d490; --teal:#2dd4bf;
  --g0:#151d25; --g1:#0e4429; --g2:#006d32; --g3:#26a641; --g4:#39d353; --g5:#7ee787;
  --pad-h:16px; --card-pad:18px; --radius:14px; --font-hero:52px; --cell-gap:2px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  line-height:1.65;padding:0 var(--pad-h) calc(90px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 80% 45% at 50% -8%,rgba(232,176,75,.11),transparent 70%),
                   radial-gradient(ellipse 60% 35% at 90% 30%,rgba(45,212,191,.06),transparent 70%);
  background-attachment:fixed;
}
.wrap{max-width:1180px;margin:0 auto}

/* ===== 页头 ===== */
header{display:flex;align-items:center;justify-content:space-between;padding:26px 0 8px;gap:12px}
.brand{display:flex;align-items:center}
.brand-art{display:block;width:142px;height:71px;overflow:visible;filter:drop-shadow(0 4px 12px rgba(232,176,75,.30))}
.brand-art path{fill:url(#shuji-gold)}
.brand-sub{font-size:9px;color:var(--dim);letter-spacing:3.6px;margin-top:4px;text-transform:uppercase}
.share-btn{
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241703;border:0;border-radius:999px;
  padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  box-shadow:0 6px 20px rgba(232,176,75,.22);
}

/* ===== Hero ===== */
.hero{text-align:center;padding:38px 4px 32px;position:relative}
.hero::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:56px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero-label{font-size:12px;color:var(--muted);letter-spacing:3px}
.hero-user{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}
.hero-user img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#1a222b;border:1px solid rgba(232,176,75,.45);box-shadow:0 0 0 3px rgba(232,176,75,.08);flex:none}
.hero-user span{font-size:13px;color:var(--muted);letter-spacing:.04em}
.hero-num{font-family:Georgia,"Times New Roman",serif;font-size:var(--font-hero);font-weight:700;letter-spacing:-2px;line-height:1.12;margin:10px 0 6px;
  background:linear-gradient(180deg,#fff5e0 0%,var(--gold2) 42%,var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 6px 26px rgba(232,176,75,.22));}
.hero-unit{font-family:-apple-system,"PingFang SC",sans-serif;font-size:18px;font-weight:500;letter-spacing:1px;margin-left:8px;-webkit-text-fill-color:var(--gold2)}
.hero-sub{font-size:12px;color:var(--muted);letter-spacing:.6px}
.hero-sub b{color:var(--fg);font-weight:600}
.hero-range{display:inline-block;margin-top:14px;font-size:10px;color:var(--dim);letter-spacing:2px;border:1px solid var(--border);border-radius:999px;padding:4px 14px}
.pills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 24px}
.pill{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 4px;text-align:center}
.pill b{display:block;font-family:Georgia,serif;font-size:20px;color:var(--fg);line-height:1.3}
.pill span{display:block;font-size:10px;color:var(--muted);margin-top:2px}

/* ===== 区块 ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--card-pad);margin-bottom:14px;backdrop-filter:blur(6px)}
.sec-title{font-size:15px;font-weight:600;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
.sec-title::before{content:"";width:3px;height:14px;background:var(--gold);border-radius:2px;flex:none}
.sec-title .en{font-size:9px;color:var(--dim);letter-spacing:2px;font-weight:400;margin-left:auto;text-transform:uppercase}
.sec-note{color:var(--muted);font-size:11px;margin:8px 0 12px;line-height:1.7}
.tab{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:5px 14px;font-size:11px;cursor:pointer;transition:.15s;white-space:nowrap}
.tab.active{background:rgba(232,176,75,.14);color:var(--gold2);border-color:rgba(232,176,75,.42);font-weight:600}
.tab b{font-family:Georgia,serif;font-size:13px;margin-left:5px;color:var(--gold2)}

/* ===== 书墙 ===== */
.year-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border)}
.year-tab{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap}
.year-tab b{font-family:Georgia,serif;font-size:16px;color:var(--fg);margin-left:7px}
.year-tab.active{background:rgba(232,176,75,.14);color:var(--gold2);border-color:rgba(232,176,75,.45)}
.year-tab.active b{color:var(--gold2)}
.book-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:18px 14px}
.book-card{min-width:0;cursor:pointer;border:0;background:transparent;color:inherit;text-align:left;padding:0;font-family:inherit}
.book-cover{width:100%;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:linear-gradient(145deg,#24303c,#131a22);border:1px solid rgba(255,255,255,.11);box-shadow:0 8px 22px rgba(0,0,0,.32);position:relative;transition:transform .18s,box-shadow .18s}
.book-card:hover .book-cover,.book-card:focus-visible .book-cover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.45)}
.book-cover img{width:100%;height:100%;object-fit:cover;display:block}
.book-cover .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:11px;color:#b8c4d0;line-height:1.5}
.book-title{font-size:11px;line-height:1.5;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.book-author{font-size:10px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-date{font-size:9px;color:#4a5663;margin-top:1px}
.empty{color:var(--dim);font-size:12px;padding:24px 0;text-align:center}

/* ===== 词云 ===== */
.cloud{width:100%;height:300px;position:relative;overflow:hidden}
.cloud svg{display:block;width:100%;height:100%}
.cloud text{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}

/* ===== 热力图：每日一点，宽度拉伸 ===== */
.heat-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.heat-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.heat-summary{font-size:12px;color:var(--muted)}
.heat-summary b{color:var(--gold2);font-family:Georgia,serif;font-size:15px}
.legend{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.heat-layout{display:grid;grid-template-columns:var(--days-w,20px) minmax(0,1fr);column-gap:7px}
.month-row{grid-column:2;grid-row:1;display:grid;gap:var(--cell-gap);margin-bottom:5px;height:13px;font-size:9px;color:var(--dim);white-space:nowrap}
.month-row span{text-align:left;overflow:visible;min-width:0}
.heat-days{grid-column:1;grid-row:2;display:grid;grid-template-rows:repeat(7,1fr);gap:var(--cell-gap);font-size:9px;color:var(--dim);line-height:1}
.heat-days span{display:flex;align-items:center;justify-content:flex-end}
.heat-grid{grid-column:2;grid-row:2;display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-auto-columns:1fr;gap:var(--cell-gap);width:100%}
.cell{width:100%;aspect-ratio:1;border-radius:2px;background:var(--g0);cursor:pointer;min-height:0}
.cell[data-l="1"]{background:var(--g1)}.cell[data-l="2"]{background:var(--g2)}
.cell[data-l="3"]{background:var(--g3)}.cell[data-l="4"]{background:var(--g4)}
.cell[data-l="5"]{background:var(--g5)}
.heat-tip{margin-top:10px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--muted)}
.heat-tip[hidden]{display:none}
.heat-tip b{color:var(--teal)}

/* ===== 阅读画像 ===== */
.pf-grid{display:grid;gap:20px}
.pf-h{font-size:12px;color:var(--fg);font-weight:600;letter-spacing:.4px;margin-bottom:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pf-h span{font-size:10px;color:var(--gold2);font-weight:400}
.hour-chart{display:block;width:100%;height:auto}
.hour-chart text{font-family:inherit}
.hour-chart .hx{fill:var(--dim);font-size:9px}
.hour-chart .peak{fill:var(--gold2);font-size:10px;font-weight:600}
.pf-listen{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:12px;background:var(--g0)}
.pf-listen i{display:block;height:100%}
.pf-listen .rd{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.pf-listen .ls{background:#2f4a58}
.pf-listen-note{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:5px}
.pf-cats-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--g0);gap:1px}
.pf-cats-bar i{display:block;height:100%}
.pf-cats-legend{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:9px;font-size:10px;color:var(--muted)}
.pf-cats-legend span{display:flex;align-items:center;gap:5px}
.pf-cats-legend u{width:7px;height:7px;border-radius:2px;display:inline-block;flex:none}
.pf-cats-legend b{color:#d5dde5;font-weight:500}
.pf-authors{display:grid;gap:9px}
.pf-author{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline}
.pf-author b{font-size:12px;font-weight:500;color:#d5dde5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-author em{font-size:10px;color:var(--dim);font-style:normal}
.pf-bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--g0);overflow:hidden}
.pf-bar i{display:block;height:100%;background:linear-gradient(90deg,rgba(232,176,75,.55),var(--gold))}
.pf-years{display:grid;gap:7px;margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}
.pf-year{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;font-size:11px;color:var(--muted)}
.pf-year b{font-family:Georgia,serif;font-size:12px;color:var(--fg)}
.pf-year .yb{height:7px;border-radius:4px;background:var(--g0);overflow:hidden}
.pf-year .yb i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#0e4429,var(--g3))}
.pf-year.now b{color:var(--gold2)}
.pf-year.now .yb i{background:linear-gradient(90deg,rgba(232,176,75,.5),var(--gold))}
.pf-medals{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}
.pf-medal{display:flex;align-items:center;gap:6px;background:rgba(232,176,75,.07);border:1px solid rgba(232,176,75,.2);border-radius:999px;padding:4px 11px;font-size:10px;color:#cfc1a4}
.pf-medal b{font-weight:600;color:var(--gold2)}
.pf-medal i{font-style:normal;color:var(--dim);font-size:9px}
.pf-medal.plain{background:rgba(255,255,255,.04);border-color:var(--border);color:var(--muted)}
.pf-medal.plain b{color:#d5dde5}
.pf-empty{font-size:11px;color:var(--dim)}

/* ===== 隐私 ===== */
.privacy{background:rgba(232,176,75,.06);border:1px solid rgba(232,176,75,.18);border-radius:10px;padding:13px 14px;color:#c9bda1;font-size:11px;line-height:1.8}
.privacy b{color:var(--gold2)}
.privacy code,#wall-note code{background:rgba(0,0,0,.32);padding:1px 5px;border-radius:4px;font-size:10px;color:var(--gold2);font-family:ui-monospace,Consolas,monospace}
footer{text-align:center;color:var(--dim);font-size:10px;margin-top:24px;line-height:1.9}

/* ===== 弹层 ===== */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,6,9,.84);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(5px)}
.modal.open{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#141b22;border:1px solid var(--border);border-bottom:0;border-radius:18px 18px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px}
.sheet-head strong{font-size:16px;letter-spacing:1px}
.sheet-sub{font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.02em}
.sheet-close{background:transparent;border:0;color:var(--muted);font-size:26px;line-height:1;width:34px;height:34px;cursor:pointer;flex:none}
.poster-wrap{background:linear-gradient(180deg,#101820,#0a1015);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.poster-wrap img{display:block;width:100%;max-width:330px;height:auto;margin:0 auto;border-radius:8px}
.poster-meta{font-size:10px;color:var(--dim);margin-top:8px;letter-spacing:.06em}
.share-label{font-size:10px;color:var(--dim);letter-spacing:.16em;margin:16px 0 -4px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.mod{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.mod input{accent-color:var(--gold);width:15px;height:15px;cursor:pointer}
.mod.on{color:var(--fg);border-color:rgba(232,176,75,.35);background:rgba(232,176,75,.08)}
.sheet-note{font-size:11px;color:var(--muted);line-height:1.75;margin:12px 2px}
.sheet-note b{color:var(--gold2)}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--fg);border-radius:9px;padding:11px 10px;font-size:13px;cursor:pointer;min-height:44px}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241703;border:0;font-weight:700}
.btn.wide{grid-column:1/-1}
.share-text{width:100%;margin-top:10px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:11px;line-height:1.75;padding:10px;resize:none;height:132px;font-family:inherit}

/* ===== 书籍详情 ===== */
.bk-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
.bk-cover{width:104px;aspect-ratio:3/4;object-fit:cover;border-radius:7px;border:1px solid var(--border);flex:none;background:#1a222b}
.bk-info{min-width:0;flex:1}
.bk-title{font-size:19px;font-weight:700;line-height:1.35;word-break:break-all}
.bk-author{font-size:12px;color:var(--muted);margin-top:4px}
.bk-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bk-meta span{font-size:10px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:999px;padding:3px 9px}
.bk-meta b{color:var(--gold2);font-family:Georgia,serif;font-size:12px}
.bk-rate{font-size:11px;color:var(--teal);margin-top:6px}
.bk-sub{font-size:10px;color:var(--dim);margin-top:6px;line-height:1.6}
.bk-block{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}
.bk-block h3{font-size:13px;color:var(--gold2);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.bk-block h3::before{content:"";width:2px;height:11px;background:var(--gold);border-radius:2px}
.bk-intro{font-size:12px;color:#c4ccd4;line-height:1.9}
.quote{background:rgba(255,255,255,.035);border-left:2px solid var(--teal);border-radius:0 7px 7px 0;padding:9px 12px;margin:8px 0;font-size:12px;color:#d3dae1;line-height:1.8}
.quote em{display:block;font-size:10px;color:var(--dim);font-style:normal;margin-top:3px}
.thought{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:12px;color:#d3dae1;line-height:1.8}
.thought .abstract{color:var(--muted);font-size:11px;border-left:2px solid var(--gold);padding-left:8px;margin-bottom:7px}
.thought .tmeta{font-size:10px;color:var(--dim);margin-top:4px}
.bk-none{font-size:11px;color:var(--dim)}

/* ===== 单本阅读轨迹折线图 ===== */
.bk-read-top{display:flex;flex-wrap:wrap;gap:5px 14px;align-items:baseline;font-size:11px;color:var(--muted);margin-bottom:6px}
.bk-read-top b{font-family:Georgia,serif;font-size:13px;color:var(--gold2);font-weight:600}
.bk-chart{display:block;width:100%;height:auto;overflow:visible}
.bk-chart .grid{stroke:rgba(255,255,255,.07);stroke-width:1;shape-rendering:crispEdges}
.bk-chart .axis{fill:var(--dim);font-size:10px}
.bk-chart .area{fill:url(#rdGrad)}
.bk-chart .line{fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.bk-chart .dot{fill:var(--gold2);stroke:#141b22;stroke-width:1}
.bk-chart .dot-peak{fill:#fff3d6}
.bk-read-foot{font-size:10px;color:var(--dim);margin-top:5px}

/* ===== 渐进增强：桌面优先 ===== */
@media(min-width:640px){
  :root{--pad-h:28px;--card-pad:24px;--radius:16px;--font-hero:76px;--cell-gap:3px}
  body{padding-bottom:60px}
  header{padding-top:38px}
  .brand-art{width:186px;height:93px}
  .brand-sub{font-size:10px;margin-top:6px}
  .hero{padding:58px 4px 48px}
  .hero-label{font-size:13px}.hero-unit{font-size:22px}.hero-sub{font-size:13px}
  .hero-user img{width:38px;height:38px}.hero-user span{font-size:14px}
  .pills{gap:12px;margin:22px 0 30px}.pill b{font-size:25px}.pill span{font-size:11px}
  .card{margin-bottom:20px}.sec-title{font-size:16px}.sec-note{font-size:12px}
  .cloud{height:380px}
  .book-wall{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:24px 18px}
  .book-title{font-size:12px}.book-author{font-size:11px}.book-date{font-size:10px}
  .year-tab{font-size:14px;padding:9px 18px}
  .heat-layout{--days-w:26px}
  .heat-days{font-size:10px}
  .month-row{font-size:10px;height:15px}
  .sheet{border-radius:16px;margin-bottom:24px;max-width:520px}
  .poster-wrap img{max-width:360px}
  .modal.align-center{align-items:center}
  .modal.align-center .sheet{max-width:700px}
  .bk-cover{width:132px}
  .bk-title{font-size:22px}
  .bk-intro,.quote,.thought{font-size:13px}
}
@media(min-width:900px){
  .book-wall{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .pf-grid{grid-template-columns:1.1fr .9fr;gap:32px}
  .pf-year{grid-template-columns:52px 1fr 72px;font-size:12px}
  .modal.align-center .share-sheet{max-width:880px}
  .share-grid{display:grid;grid-template-columns:352px minmax(0,1fr);gap:28px;align-items:start;margin-top:4px}
  .share-left{position:sticky;top:0}
  .share-right .share-label{margin-top:0}
  .share-right .share-text{height:150px}
}
@media(max-width:899px){
  .poster-wrap img{width:auto;max-width:100%;max-height:54vh}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

    const t=(word.weight-minW)/((maxW-minW)||1);
    let size=Math.round(minF+(maxF-minF)*Math.pow(t,pow));
    const raw=String(word.text), label=raw.length>maxLabel?raw.slice(0,maxLabel-1)+'…':raw;
    let tw=textWidth(label,size), th=size*1.42, limit=W-14;
    if(tw>limit){ const k=limit/tw; size=Math.max(10,Math.floor(size*k)); tw=textWidth(label,size); th=size*1.42; }
    let ok=false;
    for(let step=0;step<4200;step++){
      const a=step*.11, r=1.7*a;
      const x=cx+r*Math.cos(a)-tw/2, y=cy+r*Math.sin(a)*.74-th/2;
      if(x<3||y<3||x+tw>W-3||y+th>H-3) continue;
      const box={x,y,w:tw,h:th};
      let hit=false;
      for(const p of placed){
        if(box.x<p.x+p.w+7 && box.x+box.w+7>p.x && box.y<p.y+p.h+9 && box.y+box.h+9>p.y){ hit=true; break; }
      }
      if(hit) continue;
      placed.push(box);
      const color=t>.62?'#2dd4bf':t>.28?'#e8b04b':'#8393a5';
      const node=document.createElementNS(NS,'text');
      node.setAttribute('x',(x+tw/2).toFixed(1)); node.setAttribute('y',(y+size*1.02).toFixed(1));
      node.setAttribute('text-anchor','middle'); node.setAttribute('font-size',size);
      node.setAttribute('font-weight',t>.62?700:600); node.setAttribute('fill',color);
      node.setAttribute('font-family',FONT); node.setAttribute('opacity',(.72+t*.28).toFixed(2));
      node.textContent=label;
      const tip=document.createElementNS(NS,'title');
      tip.textContent=raw+'　'+(opts.label?opts.label(word.weight):word.weight);
      node.appendChild(tip); svg.appendChild(node); ok=true; break;
    }
  }
  el.appendChild(svg);
}

// 单本书的逐日阅读折线：横轴=日历天，纵轴=当天阅读时长
function readingBlock(b){
  const r=b.reading;
  if(!r||!(r.daily||[]).length) return '';
  const toTs=s=>{const p=String(s).split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]);};
  const startTs=toTs(r.begin||r.daily[0].d), endTs=toTs(r.last||r.daily[r.daily.length-1].d);
  if(!isFinite(startTs)||!isFinite(endTs)||endTs<startTs) return '';
  const span=Math.round((endTs-startTs)/86400000)+1;
  const vals=new Array(span).fill(0);
  let total=0,active=0,peak=0,peakIdx=0;
  r.daily.forEach(p=>{
    const i=Math.round((toTs(p.d)-startTs)/86400000);
    if(i<0||i>=span) return;
    vals[i]+=p.s; total+=p.s; active++;
    if(vals[i]>peak){peak=vals[i];peakIdx=i;}
  });
  if(!total) return '';
  const iso=i=>new Date(startTs+i*86400000).toISOString().slice(0,10);
  const md=s=>s.slice(5).replace('-','/');
  // 弹层可能还没展开（clientWidth=0），此时用视口宽度估算
  const box=$('book-sheet').clientWidth||Math.min(700,window.innerWidth);
  const W=Math.max(248,Math.min(660,box-36));
  const H=Math.round(Math.max(102,Math.min(148,W*0.3)));
  const PL=36,PR=10,PT=14,PB=19, iw=W-PL-PR, ih=H-PT-PB;
  let maxMin=Math.max(10,Math.ceil(peak/60/10)*10);
  if(peak>=maxMin*60*0.9) maxMin+=10;   // 给最高点留一点呼吸空间
  const maxSec=maxMin*60;
  const x=i=>span>1?PL+i*iw/(span-1):PL+iw/2;
  const y=v=>PT+ih-Math.min(v,maxSec)/maxSec*ih;
  const line=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area=`M${x(0).toFixed(1)} ${(PT+ih).toFixed(1)}`+vals.map((v,i)=>`L${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('')+`L${x(span-1).toFixed(1)} ${(PT+ih).toFixed(1)}Z`;
  const grid=[1,0.5,0].map(f=>{
    const gy=PT+ih-f*ih;
    return `<line class="grid" x1="${PL}" y1="${gy.toFixed(1)}" x2="${W-PR}" y2="${gy.toFixed(1)}"/>`+
           `<text class="axis" x="${PL-6}" y="${(gy+3.2).toFixed(1)}" text-anchor="end">${shortDur(maxSec*f)}</text>`;
  }).join('');
  const dots=span<=70?vals.map((v,i)=>v>0?
    `<circle class="dot${i===peakIdx?' dot-peak':''}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===peakIdx?3.3:2.1}"><title>${iso(i).slice(5)} · ${fmt(v)}</title></circle>`:'').join(''):'';
  let xlab=`<text class="axis" x="${PL}" y="${H-6}" text-anchor="start">${md(iso(0))}</text>`;
  if(span>9){
    const mid=Math.floor((span-1)/2);
    xlab+=`<text class="axis" x="${x(mid).toFixed(1)}" y="${H-6}" text-anchor="middle">${md(iso(mid))}</text>`;
  }
  if(span>1) xlab+=`<text class="axis" x="${W-PR}" y="${H-6}" text-anchor="end">${md(iso(span-1))}</text>`;
  return `<div class="bk-block"><h3>阅读轨迹</h3>
    <div class="bk-read-top"><b>${r.begin} → ${r.last}</b><span>区间 ${span} 天</span><span>每天在读 ${active} 天</span><span>阅读日均 ${fmt(total/active)}</span>${peak?`<span>最长一天 ${md(iso(peakIdx))} · ${fmt(peak)}</span>`:''}</div>
    <svg class="bk-chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="这本书的逐日阅读时长折线图">
      <defs><linearGradient id="rdGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e8b04b" stop-opacity=".34"/>
        <stop offset="100%" stop-color="#e8b04b" stop-opacity=".02"/>
      </linearGradient></defs>
      ${grid}<path class="area" d="${area}"/><path class="line" d="${line}"/>${dots}${xlab}
    </svg>
    <div class="bk-read-foot">折线按日历逐日绘制，谷底为那天几乎没读。${r.days>active?`累计阅读 ${r.days} 天，接口只返回其中 ${active} 天的逐日明细。`:''}</div>
  </div>`;
}

function renderHeat(year){

/* ===== 阅读画像 ===== */
function hourChart(hours,peak){
  const max=Math.max(...hours,1);
  const W=360,PL=4,PR=8,PT=16,PB=17,H=120,ih=H-PT-PB,iw=W-PL-PR,step=iw/24,bw=Math.max(4,step*.6);
  const y0=PT+ih;
  let bars='',labels='';
  hours.forEach((v,i)=>{
    const h=Math.max(v>0?2:0,Math.round(v/max*ih));
    const r=v/max;
    const fill=r>.78?'#f5d490':r>.55?'#e8b04b':r>.3?'rgba(232,176,75,.6)':'rgba(232,176,75,.26)';
    const x=PL+i*step+(step-bw)/2;
    bars+=`<rect x="${x.toFixed(1)}" y="${(y0-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h}" rx="1.4" fill="${fill}"><title>${i}:00　${fmt(v)}</title></rect>`;
  });
  [0,6,12,18,23].forEach(h=>{
    const x=PL+h*step+step/2;
    labels+=`<text class="hx" x="${x.toFixed(1)}" y="${H-4}" text-anchor="${h===0?'start':h===23?'end':'middle'}">${h}</text>`;
  });
  let peakTag='';
  if(peak!=null&&peak>=0){
    const x=PL+peak*step+step/2;
    peakTag=`<line x1="${x.toFixed(1)}" y1="${PT-3}" x2="${x.toFixed(1)}" y2="${y0}" stroke="rgba(232,176,75,.35)" stroke-dasharray="2 3"/>`+
      `<text class="peak" x="${x.toFixed(1)}" y="${PT-6}" text-anchor="${peak<3?'start':peak>21?'end':'middle'}">${peak} 点</text>`;
  }
  return `<svg class="hour-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="24 小时阅读时长分布">${bars}${peakTag}${labels}</svg>`;
}

    const rows=yearly.map(y=>({year:y.year,seconds:(DATA.years[y.year]||{}).totalReadTime||y.seconds}));

  const honors=(p.overview||[]).map(o=>`<div class="pf-medal plain" title="${esc(o.desc)}"><b>${esc(o.title)}</b><i>${esc(o.value)}</i></div>`).join('');

}

const digits = s => String(s==null?'':s).replace(/[^\d.]/g,'');
const wanNum = n => { n=+n||0; return n>=1e8?(n/1e8).toFixed(2)+'亿':(n/1e4).toFixed(1)+'万'; };
function yearSpan(){

  if(mods.kpi){

function fit(ctx,s,max,n){ s=String(s||''); if(s.length>n)s=s.slice(0,n-1)+'…'; while(ctx.measureText(s).width>max&&s.length>2)s=s.slice(0,-2)+'…'; return s; }
function rrect(x,a,b,w,h,r){
  r=Math.max(0,Math.min(r,h/2,w/2));
  x.beginPath();
  x.moveTo(a+r,b); x.lineTo(a+w-r,b); x.arcTo(a+w,b,a+w,b+r,r);
  x.lineTo(a+w,b+h-r); x.arcTo(a+w,b+h,a+w-r,b+h,r);
  x.lineTo(a+r,b+h); x.arcTo(a,b+h,a,b+h-r,r);
  x.lineTo(a,b+r); x.arcTo(a,b,a+r,b,r);
  x.closePath();
}

  }
  x.fillStyle=PC.dim;x.font=`11px ${FONT}`;x.fillText('书迹 · 由微信读书官方接口生成',W/2,H-54);
  x.fillStyle='rgba(92,104,117,.7)';x.font=`10px ${FONT}`;x.fillText('数据仅存于本地',W/2,H-36);
  return c.toDataURL('image/png');
}
function refreshPoster(){
  const mods=modState();
  shareCopy=buildShareText(mods); $('share-text').value=shareCopy;
  try{
    posterURL=drawPoster(mods);
    $('poster-img').src=posterURL; $('poster-img').style.display='block';
    $('poster-meta').textContent='640 × '+posterH+' px　·　PNG　·　可长按保存';
    $('dl-poster').disabled=false;
  }catch(e){
    posterURL=''; $('poster-img').style.display='none';
    $('poster-meta').textContent='海报生成失败，可复制文案分享';
  }
}
function loadPosterAvatar(){
  const src=DATA.user&&DATA.user.avatar;
  if(!src) return;
  const im=new Image();
  im.onload=()=>{posterAvatar=im;refreshPoster();};
  im.src=src;
}
function initShare(){
  renderMods(); refreshPoster(); loadPosterAvatar();
  $('poster-note').innerHTML='勾选想展示的内容，海报会实时重排。手机端<b>长按海报保存到相册</b>，电脑端可直接下载 PNG。<br>总量、时段与逐年数据来自官方聚合统计，仍含私密书贡献（无法拆分）。';
  $('share-btn').addEventListener('click',()=>{ $('share-modal').classList.add('open');document.body.style.overflow='hidden';$('close-share').focus(); });
  $('close-share').addEventListener('click',()=>{ $('share-modal').classList.remove('open');if(!$('book-modal').classList.contains('open'))document.body.style.overflow=''; });
  $('share-modal').addEventListener('click',e=>{if(e.target===$('share-modal'))$('close-share').click();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeBook();if($('share-modal').classList.contains('open'))$('close-share').click();}});
  $('dl-poster').addEventListener('click',()=>{
    if(!posterURL){$('poster-note').textContent='海报生成失败，请复制文案分享。';return;}
    const a=document.createElement('a');a.href=posterURL;a.download='书迹-分享海报.png';document.body.appendChild(a);a.click();a.remove();
  });
  $('copy-text').addEventListener('click',async()=>{
    let ok=false;try{await navigator.clipboard.writeText(shareCopy);ok=true;}catch(e){}
    if(!ok){$('share-text').select();try{ok=document.execCommand('copy');}catch(e){}window.getSelection().removeAllRanges();}
    $('copy-text').textContent=ok?'已复制 ✓':'请手动复制下方文案';
    setTimeout(()=>{$('copy-text').textContent='复制文案';},1800);
  });
  if(navigator.share){
    const b=$('sys-share');b.hidden=false;
    b.addEventListener('click',async()=>{try{await navigator.share({title:'书迹 · 我的阅读轨迹',text:shareCopy});}catch(e){}});
  }
}

/* ===== 启动 ===== */
function init(){
  renderHero(); renderBookCloud(); renderBookYears(); renderHeatTabs(); renderProfile(); renderPrivacy(); initShare();
  $('close-book').addEventListener('click',closeBook);
  $('book-modal').addEventListener('click',e=>{if(e.target===$('book-modal'))closeBook();});
  if(location.hash==='#share') $('share-btn').click();
  let rt;
  window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{renderBookCloud();renderHeat(currentYear);},200);},{passive:true});
}
init();
</script>
